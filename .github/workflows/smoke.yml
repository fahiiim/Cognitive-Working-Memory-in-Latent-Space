name: cpu-smoke

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (CPU torch)
        run: |
          uv venv .venv
          uv pip install --python .venv torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv numpy scipy pandas matplotlib pyyaml tqdm pytest
          uv pip install --python .venv --no-deps -e .
      - name: Unit, theory and smoke tests
        run: .venv/bin/python -m pytest -q
      - name: Bibliography identifiers and cite keys (offline)
        run: .venv/bin/python scripts/check_bib.py --offline
