# Ablations on T1 addition (notebook 08). Every entry changes one component of the main setup.
base:
  task: addition
  objective: fixed_prior
  iters: 8000
  batch_size: 512
  t_train: 20
runs:
  - {method: base, recall: false, tags: {ablation: no_recall}}
  - {method: base, convs_per_step: 2, tags: {ablation: r_2}}
  - {method: base, width: 64, tags: {ablation: width_64}}
grid:
  seed: [0]
