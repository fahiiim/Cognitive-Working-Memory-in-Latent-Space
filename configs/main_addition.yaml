# Main grid for T1 addition. Objective from the pilot (notebook 03; tie on validation, see
# PREREGISTRATION.md). Reduced scale (5-hour compute limit): seeds 0-1 for every method. The pooled gates (ACT, PonderNet, v1 gate) are in main_gates.yaml.
base:
  task: addition
  objective: fixed_prior
  iters: 8000
  batch_size: 512
  t_train: 20
runs:
  - {method: base}
  - {method: done_prop_joint}
  - {method: done_joint}
  - {method: trm_joint}
grid:
  seed: [0, 1]
