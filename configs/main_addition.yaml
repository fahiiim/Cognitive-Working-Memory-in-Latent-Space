# Main grid for T1 addition: backbone objective chosen in the pilot (notebook 03).
# The pooled gates (ACT, PonderNet, v1 gate) are in main_gates.yaml.
base:
  task: addition
  objective: fixed_prior
  iters: 8000
  batch_size: 512
  t_train: 20
runs:
  - {method: base}
  - {method: trm_joint}
  - {method: done_joint}
  - {method: done_prop_joint}
grid:
  seed: [0, 1, 2, 3, 4]
